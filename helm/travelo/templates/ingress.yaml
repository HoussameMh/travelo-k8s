{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "travelo.fullname" . }}-ingress
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.frontendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "travelo.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
    - host: {{ .Values.ingress.backendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "travelo.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
{{- end }}
