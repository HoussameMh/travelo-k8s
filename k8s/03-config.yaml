apiVersion: v1
kind: ConfigMap
metadata:
  name: travelo-config
  namespace: travelo
data:
  MYSQL_DATABASE: travelo_db
  MYSQL_USER: travelo
  SPRING_DATASOURCE_URL: jdbc:mysql://travelo-database:3306/travelo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: travelo
  SPRING_JPA_SHOW_SQL: "false"
  LOGGING_LEVEL_ORG_HIBERNATE_TOOL_SCHEMA: INFO
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
