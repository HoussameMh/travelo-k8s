{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "travelo.secretName" .) -}}
{{- $root := .Values.database.rootPassword -}}
{{- $app := .Values.database.password -}}
{{- if and (not $root) $existing }}{{ $root = index $existing.data "MYSQL_ROOT_PASSWORD" | b64dec }}{{ end -}}
{{- if and (not $app) $existing }}{{ $app = index $existing.data "MYSQL_PASSWORD" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "travelo.secretName" . }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ default (randAlphaNum 20) $root | b64enc | quote }}
  MYSQL_PASSWORD: {{ default (randAlphaNum 20) $app | b64enc | quote }}
