apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelo.dbHost" . }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "travelo.selector" (dict "root" . "component" "database") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "travelo.dbHost" . }}
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "travelo.dbHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "travelo.selector" (dict "root" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: travelo
        {{- include "travelo.selector" (dict "root" . "component" "database") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: {{ .Values.database.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.user | quote }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "travelo.secretName" . }}
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "travelo.secretName" . }}
                  key: MYSQL_PASSWORD
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
