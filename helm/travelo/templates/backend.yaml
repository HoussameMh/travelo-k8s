apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelo.fullname" . }}-backend
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "travelo.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "travelo.fullname" . }}-backend
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "travelo.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: travelo
        {{- include "travelo.selector" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 12 }}
    spec:
      initContainers:
        - name: wait-for-mysql
          image: {{ .Values.database.image }}
          command:
            - sh
            - -c
            - until mysqladmin ping -h {{ include "travelo.dbHost" . }} --silent; do echo "En attente de MySQL..."; sleep 3; done
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "travelo.fullname" . }}-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "travelo.secretName" . }}
                  key: MYSQL_PASSWORD
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
