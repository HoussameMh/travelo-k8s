apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "travelo.fullname" . }}-config
  labels:
    {{- include "travelo.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  MYSQL_USER: {{ .Values.database.user | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:mysql://%s:3306/%s?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" (include "travelo.dbHost" .) .Values.database.name | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.user | quote }}
  SPRING_JPA_SHOW_SQL: "false"
  JAVA_TOOL_OPTIONS: {{ .Values.backend.javaOptions | quote }}
